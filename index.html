<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description"
    content="RAYNOR — The Essence of Luxury. First Light Eau de Parfum. A vibrant blend of citrus and warm amber." />

  <!-- === CRITICAL PRELOADS (highest priority, fetched before HTML finishes parsing) === -->
  <!-- Logo is LCP during loader — must arrive before JS executes -->
  <link rel="preload" as="image" href="/images/raynor-logo.png" fetchpriority="high" />
  <!-- Hero background is LCP after loader — preload in parallel -->
  <link rel="preload" as="image" href="/images/perfume/first_light/hero.webp" fetchpriority="high" />
  <!-- Bottle is the centrepiece — must never pop in -->
  <link rel="preload" as="image" href="/images/perfume/first_light/bottle.webp" fetchpriority="high" />

  <!-- === FONT STRATEGY: preconnect + non-blocking swap === -->
  <!-- Preconnect to establish TCP+TLS handshake as early as possible -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- media="print" trick: loads async, switches to "all" on load — zero render-block -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <!-- Fallback for no-JS -->
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </noscript>

  <!--
      CRITICAL INLINE STYLES — parsed on byte 0, before any JS/CSS bundle loads.
      Guarantees absolute zero white flash at any network speed.
    -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #000000 !important;
      overflow-x: hidden;
    }

    #root {
      background-color: #000000;
      min-height: 100vh;
    }

    /* Native preloader: covers everything from the very first frame */
    #html-preloader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999998;
      pointer-events: none;
    }
  </style>

  <title>RAYNOR — The Essence of Luxury | First Light</title>
</head>

<body>
  <!--
      #html-preloader is a pure-HTML black div painted before React boots.
      Bridges the ~100-200ms gap between HTML parse and first React render.
      Removed by CurtainLoader the instant its GSAP context is active.
    -->
  <div id="html-preloader"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
